name: test

on:
  push:
    branches: [main, dev, hardening]
  pull_request:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No install step: the suite is stdlib-only on purpose, so it runs the
      # same way here as it does on a machine with the plugin checked out.
      - run: node tests/run.js

  qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 test runtime
        run: sudo apt-get update && sudo apt-get install -y qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtqml-workerscript
      - name: Run hermetic backend and controller tests
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QPA_PLATFORMTHEME: generic
          QT_QUICK_CONTROLS_STYLE: Basic
        run: /usr/lib/qt6/bin/qmltestrunner -import tests/qml/imports -input tests/qml
